name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (simulation core, quick benchmark vs README)
        run: npm test

      # Every full benchmark archived in results/published/ must reproduce its CSVs byte for byte (F-16).
      # A model change that does not re-publish the data fails here.
      - name: Test (full benchmarks vs results/published)
        run: npm run test:full

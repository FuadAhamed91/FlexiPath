<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#edf1f6" />
    <title>FlexiPath Simulator</title>
    <meta
      name="description"
      content="FlexiPath simulation prototype: a predictive, traffic-aware connectivity engine that predicts path degradation, prepares the next path and selectively protects critical traffic across wired, Wi-Fi 6, 5G SA and LEO satellite links."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="h-full overflow-hidden font-sans text-slate-800 antialiased">
    <div id="app" class="h-full"></div>

    <div id="boot-splash" class="boot-splash" role="status" aria-live="polite">
      <div class="boot-core">
        <svg viewBox="0 0 64 64" width="72" height="72" class="boot-glyph" aria-hidden="true">
          <path d="M6 44 C 20 44, 22 20, 32 20 S 44 44, 58 44" fill="none" stroke="#0891B2" stroke-width="3" stroke-linecap="round" />
          <path d="M6 44 C 20 44, 24 32, 32 32 S 44 44, 58 44" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" opacity=".85" />
          <circle cx="6" cy="44" r="4" fill="#0891B2" />
          <circle cx="58" cy="44" r="4" fill="#10B981" />
        </svg>
        <div class="boot-title">FLEXIPATH</div>
        <div class="boot-sub" id="boot-status">Initialising simulation…</div>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>

    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">FlexiPath needs JavaScript and WebGL to run.</p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
    <script>
      // D-02: a page opened by double-click (file://) cannot load its module scripts and stylesheet, so it stays
      // blank. This classic inline script still runs there: it tells the visitor to serve the folder over HTTP.
      (function () {
        if (location.protocol !== 'file:') return;
        function show() {
          var splash = document.getElementById('boot-splash');
          if (splash) splash.style.display = 'none';
          var box = document.createElement('div');
          box.id = 'file-protocol-notice';
          box.setAttribute('role', 'alert');
          box.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1220;color:#e2e8f0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif';
          box.innerHTML =
            '<div style="max-width:640px">' +
            '<div style="font-weight:800;letter-spacing:.12em;color:#22d3ee;margin-bottom:8px">FLEXIPATH</div>' +
            '<h1 style="font-size:24px;margin:0 0 12px;color:#fff">Open this page through a local web server</h1>' +
            '<p style="margin:0 0 12px">The browser opened this file directly (file://). In this mode it blocks the module scripts and the stylesheet, so the simulator can not start.</p>' +
            '<p style="margin:0 0 8px">In a terminal, in the folder that holds this file, run:</p>' +
            '<pre style="margin:0 0 8px;padding:10px 12px;background:#1e293b;border-radius:6px;color:#a5f3fc;white-space:pre-wrap">sh serve.sh</pre>' +
            '<p style="margin:0 0 8px">or</p>' +
            '<pre style="margin:0 0 12px;padding:10px 12px;background:#1e293b;border-radius:6px;color:#a5f3fc;white-space:pre-wrap">python3 -m http.server 8000</pre>' +
            '<p style="margin:0">Then open <b>http://localhost:8000/</b> (guided demo: <b>http://localhost:8000/simulator.html?demo=1</b>). From the project folder, <b>npm run serve</b> builds and serves the site. README.txt has the details.</p>' +
            '</div>';
          document.body.appendChild(box);
        }
        if (document.body) show();
        else document.addEventListener('DOMContentLoaded', show);
      })();
    </script>
  </body>
</html>
